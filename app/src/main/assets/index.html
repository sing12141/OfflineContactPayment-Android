<!doctype html>
<html>
<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1,viewport-fit=cover">

    <meta name="theme-color" content="#14532d">

    <title>Offline Contact & Payment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <header>
        <h1>Contact & Payment</h1>

        <div class="headBtns">
            <button id="importBtn">IMPORT EXCEL</button>
            <button id="exportBtn">EXPORT EXCEL</button>
        </div>

        <input
            id="file"
            type="file"
            accept=".xlsx"
            hidden
        >
    </header>

    <section class="toolbar">

        <input
            id="search"
            placeholder="Search name, contact or remarks"
        >

        <select id="yearFilter">
            <option value="all">All contacts</option>
        </select>

    </section>

    <section id="stats" class="stats"></section>

    <div id="summary"></div>

    <div
        id="message"
        class="message"
        role="status">
    </div>

    <main id="list"></main>

    <button
        id="topBtn"
        class="topBtn"
        aria-label="Go to top"
        onclick="goTop()">
        ↑
    </button>

</div>

<footer>
    <button id="clearBtn">Clear Data</button>
</footer>

<script src="app.js"></script>

</body>
</html>
