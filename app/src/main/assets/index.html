<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#14532d"
    >

    <title>Offline Contact & Payment</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="app">


    <!-- HEADER -->

    <header>

        <h1>Contact & Payment</h1>

        <div class="headBtns">

            <button id="importBtn">
                IMPORT EXCEL
            </button>

            <button id="exportBtn">
                EXPORT EXCEL
            </button>

        </div>


        <!-- Hidden Excel file selector -->

        <input
            id="file"
            type="file"
            accept=".xlsx"
            hidden
        >

    </header>



    <!-- SEARCH -->

    <section class="toolbar">

        <input
            id="search"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Search name, contact or remarks"
        >

        <button
            id="searchBtn"
            type="button"
            disabled
        >
            SEARCH
        </button>

    </section>



    <!-- DASHBOARD -->

    <section
        id="stats"
        class="stats"
    >
    </section>



    <!-- SUMMARY -->

    <div id="summary"></div>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
        role="status"
    >
    </div>



    <!-- CONTACT LIST -->

    <main id="list"></main>



    <!-- GO TO TOP -->

    <button
        id="topBtn"
        class="topBtn"
        aria-label="Go to top"
        onclick="goTop()"
    >
        ↑
    </button>


</div>



<!-- CLEAR DATA -->

<footer>

    <button id="clearBtn">
        Clear Data
    </button>

</footer>



<!--
    IMPORTANT:
    SheetJS must load BEFORE app.js.
    xlsx.full.min.js is stored locally in the APK,
    so Excel import/export works completely offline.
-->

<script src="xlsx.full.min.js"></script>

<script src="app.js"></script>


</body>

</html>
